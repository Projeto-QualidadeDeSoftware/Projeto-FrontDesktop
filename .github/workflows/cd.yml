name: CD

# Entrega contínua do front desktop: a cada alteração na main
#   1. gera o instalador de HOMOLOGAÇÃO (já apontando para a API de homologação)
#      e publica como pré-release na página de Releases;
#   2. espera a aprovação de um integrante do grupo;
#   3. gera o instalador de PRODUÇÃO (apontando para a API de produção)
#      e publica como a versão oficial (latest).
#
# A aprovação é configurada em Settings > Environments > producao (Required reviewers).
# Cada environment tem a variable API_URL com o endereço da API daquele ambiente.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSAO: 1.3.${{ github.run_number }}
  JAR: front-javafx-1.0.0.jar

jobs:
  deploy-homologacao:
    name: Instalador de homologação
    # O instalador é gerado no Windows: o pacote leva o JavaFX e o Java do próprio Windows.
    runs-on: windows-2022
    environment:
      name: homologacao
    env:
      NOME: Pronte Conveniencia Homologacao
      UPGRADE_UUID: 579e23ea-8ef1-474f-804d-c867faeb40db

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Preparar o WiX (usado pelo jpackage para gerar o .exe)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $bin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
            "$($bin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Gerar o instalador
        shell: pwsh
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if (-not $env:API_URL) { throw "Defina a variable API_URL no environment 'homologacao'" }
          ./mvnw.cmd -B package
          New-Item -ItemType Directory -Force entrada | Out-Null
          Copy-Item "target/$env:JAR" entrada/
          "api.url=$env:API_URL" | Out-File -FilePath entrada/api.properties -Encoding ascii
          jpackage --type exe --name "$env:NOME" --app-version $env:VERSAO --vendor "Pronte Conveniencia" `
            --description "Front desktop do sistema Pronte Conveniencia (homologacao)" `
            --input entrada --main-jar $env:JAR --main-class com.frontdesktop.Launcher `
            --dest saida --win-per-user-install --win-menu --win-shortcut --win-upgrade-uuid $env:UPGRADE_UUID
          Get-ChildItem saida

      - name: Publicar como pré-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ vars.API_URL }}
        run: |
          gh release create "homologacao-$VERSAO" saida/*.exe \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Homologação $VERSAO" \
            --notes "Instalador de homologação, aponta para $API_URL. Usado para o roteiro de aceitação antes da aprovação para produção."

  deploy-producao:
    name: Instalador de produção
    needs: deploy-homologacao
    runs-on: windows-2022
    # Este environment tem "Required reviewers": o job fica parado até alguém do grupo aprovar.
    environment:
      name: producao
    env:
      NOME: Pronte Conveniencia
      UPGRADE_UUID: 10ae2187-9d13-4185-bd21-1e8a500839b6

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Preparar o WiX (usado pelo jpackage para gerar o .exe)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $bin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
            "$($bin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Gerar o instalador
        shell: pwsh
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if (-not $env:API_URL) { throw "Defina a variable API_URL no environment 'producao'" }
          ./mvnw.cmd -B package
          New-Item -ItemType Directory -Force entrada | Out-Null
          Copy-Item "target/$env:JAR" entrada/
          "api.url=$env:API_URL" | Out-File -FilePath entrada/api.properties -Encoding ascii
          jpackage --type exe --name "$env:NOME" --app-version $env:VERSAO --vendor "Pronte Conveniencia" `
            --description "Front desktop do sistema Pronte Conveniencia" `
            --input entrada --main-jar $env:JAR --main-class com.frontdesktop.Launcher `
            --dest saida --win-per-user-install --win-menu --win-shortcut --win-upgrade-uuid $env:UPGRADE_UUID
          Get-ChildItem saida

      - name: Publicar como versão oficial
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ vars.API_URL }}
        run: |
          gh release create "v$VERSAO" saida/*.exe \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Pronte Conveniência $VERSAO" \
            --notes "Instalador oficial para Windows, aponta para $API_URL. Baixe o arquivo .exe abaixo e execute."
